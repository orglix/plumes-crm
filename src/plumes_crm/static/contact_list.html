<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Plumes CRM — Liste des contacts</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #1e293b; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .flash { background: #dcfce7; border: 1px solid #86efac; color: #166534; padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .manual-box, .pair-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: .75rem 0; }
    .contact-col { background: #f1f5f9; padding: .9rem; border-radius: 6px; }
    .badge { display: inline-block; background: #e0e7ff; color: #3730a3; font-size: .8rem; padding: .2rem .55rem; border-radius: 999px; margin-right: .35rem; }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .75rem; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: .5rem .9rem; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-ghost { background: #e2e8f0; color: #334155; }
    input[type="number"] { padding: .45rem; border: 1px solid #cbd5e1; border-radius: 6px; width: 110px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Liste des contacts</h1>
    <a href="/">← Retour à l'assistant</a>
  </div>

<div class="crm-layout">
  <aside class="contacts-panel">
    <input
      id="contact-search"
      type="search"
      placeholder="Rechercher un contact (nom, email...)"
      autocomplete="off"
    />
    <ul id="contacts-list"></ul>
  </aside>

  <main class="contact-detail">
    <div id="empty-state">Sélectionne un contact pour voir ses résumés de threads.</div>
    <div id="selected-contact" hidden>
      <div class="contact-header">
        <div>
          <h2 id="contact-name"></h2>
          <p id="contact-email"></p>
          <p id="contact-instagram"></p>
        </div>
        <button id="toggle-summaries-btn" type="button">Afficher les résumés</button>
      </div>
      <div id="summaries-container"></div>
    </div>
  </main>
</div>

<style>
  .crm-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.5rem;
    align-items: start;
    font-family: system-ui, sans-serif;
  }
  .contacts-panel input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.75rem;
    box-sizing: border-box;
  }
  #contacts-list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 75vh;
    overflow-y: auto;
  }
  .contact-item {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid #e5e7eb;
    cursor: pointer;
  }
  .contact-item:hover,
  .contact-item.active {
    background: #f3f4f6;
  }
  .contact-item small {
    display: block;
    color: #6b7280;
  }
  .summary-card {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
  }
  .summary-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    font-size: 0.85rem;
    color: #4b5563;
    margin-bottom: 0.5rem;
  }
  .summary-text {
      white-space: pre-line;
      margin: 0.5rem 0 0;
      line-height: 1.5;
  }

  .badge {
    background: #eef2ff;
    color: #3730a3;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
</style>

<script>
  const searchInput = document.getElementById("contact-search");
  const contactsListEl = document.getElementById("contacts-list");
  const emptyStateEl = document.getElementById("empty-state");
  const selectedContactEl = document.getElementById("selected-contact");
  const contactNameEl = document.getElementById("contact-name");
  const contactEmailEl = document.getElementById("contact-email");
  const contactInstagramEl = document.getElementById("contact-instagram");
  const toggleBtn = document.getElementById("toggle-summaries-btn");
  const summariesContainer = document.getElementById("summaries-container");

  let allContacts = [];
  let currentContact = null;
  let summariesVisible = false;
  const summariesCache = new Map();

  function normalize(str) {
    return (str || "")
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/\p{Diacritic}/gu, "");
  }

  function renderContacts(filterQuery = "") {
    const q = normalize(filterQuery.trim());
    const filtered = q
      ? allContacts.filter((c) => {
          const haystack = `${c.name || ""} ${c.email || ""}`;
          return normalize(haystack).includes(q);
        })
      : allContacts;

    contactsListEl.innerHTML = "";
    if (!filtered.length) {
      contactsListEl.innerHTML = `<li class="contact-item"><small>Aucun contact trouvé</small></li>`;
      return;
    }

    for (const contact of filtered) {
      const li = document.createElement("li");
      li.className = "contact-item" + (currentContact?.id === contact.id ? " active" : "");
      li.innerHTML = `
        <strong>${escapeHtml(contact.name || "Sans nom")}</strong>
        <small>${escapeHtml(contact.email || "")}</small>
      `;
      li.addEventListener("click", () => selectContact(contact));
      contactsListEl.appendChild(li);
    }
  }

  async function selectContact(contact) {
    currentContact = contact;
    summariesVisible = false;
    summariesContainer.innerHTML = "";
    toggleBtn.textContent = "Afficher les résumés";

    emptyStateEl.hidden = true;
    selectedContactEl.hidden = false;
    contactNameEl.textContent = contact.name || "Sans nom";
    contactEmailEl.textContent = contact.email || "";
    contactInstagramlEl.textContent = contact.instagram || "";

    renderContacts(searchInput.value);
  }

  async function loadAndRenderSummaries(contactId) {
    summariesContainer.innerHTML = `<p>Chargement des résumés...</p>`;

    let items = summariesCache.get(contactId);
    if (!items) {
      const resp = await fetch(`/api/contacts/${contactId}/summaries`);
      if (!resp.ok) {
        summariesContainer.innerHTML = `<p>Erreur lors du chargement des résumés.</p>`;
        return;
      }
      items = await resp.json();
      summariesCache.set(contactId, items);
    }

    if (!items.length) {
      summariesContainer.innerHTML = `<p>Aucun résumé de thread enregistré pour ce contact.</p>`;
      return;
    }

    summariesContainer.innerHTML = items
      .map((item) => {
        const badges = (item.categories || [])
          .map((cat) => `<span class="badge">${escapeHtml(cat)}</span>`)
          .join(" ");
        const dateLabel = item.last_message_at
          ? new Date(item.last_message_at).toLocaleString("fr-FR")
          : "Date inconnue";

        return `
          <article class="summary-card">
            <div class="summary-meta">
              <strong>Thread ${escapeHtml(item.thread_key)}</strong>
              <span>• ${item.message_count ?? 0} msg</span>
              <span>• Dernier message : ${escapeHtml(dateLabel)}</span>
              <div>${badges}</div>
            </div>
            <div class="summary-body">${formatSummaryHtml(item.summary)}</div>
          </article>
        `;
      })
      .join("");
  }

  toggleBtn.addEventListener("click", async () => {
    if (!currentContact) return;
    summariesVisible = !summariesVisible;
    if (summariesVisible) {
      toggleBtn.textContent = "Masquer les résumés";
      await loadAndRenderSummaries(currentContact.id);
    } else {
      toggleBtn.textContent = "Afficher les résumés";
      summariesContainer.innerHTML = "";
    }
  });

  searchInput.addEventListener("input", (e) => {
    renderContacts(e.target.value);
  });

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  async function initContacts() {
    const resp = await fetch("/api/contacts");
    if (!resp.ok) {
      contactsListEl.innerHTML = `<li class="contact-item"><small>Impossible de charger les contacts</small></li>`;
      return;
    }
    allContacts = await resp.json();
    renderContacts("");
  }

function formatSummaryHtml(rawSummary) {
  const lines = (rawSummary || "")
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean);

  if (!lines.length) return "";

  let html = "";
  let inList = false;

  for (const line of lines) {
    if (line.startsWith("- ")) {
      if (!inList) {
        html += `<ul class="summary-bullets">`;
        inList = true;
      }
      html += `<li>${escapeHtml(line.slice(2))}</li>`;
    } else {
      if (inList) {
        html += `</ul>`;
        inList = false;
      }
      html += `<p class="summary-heading">${escapeHtml(line)}</p>`;
    }
  }

  if (inList) {
    html += `</ul>`;
  }

  return html;
}

  initContacts();
</script>

  </body>
</html>
