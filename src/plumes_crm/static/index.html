<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plumes CRM</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="home-page">
  <header class="app-header">
    <a href="/" class="brand">
      <img
        src="/static/img/logo.png"
        alt="Logo Plumes CRM"
        class="brand-logo"
      />
      <h1 class="brand-title">Plumes CRM</h1>
    </a>

    <nav class="header-actions" aria-label="Actions principales">
      <a href="/duplicates" class="btn btn-nav">
        Contacts à regrouper
        <span id="dup-count" class="badge-count">__DUPLICATE_COUNT__</span>
      </a>
      <button
        type="button"
        id="followups-btn"
        class="btn btn-ghost"
        title="Bientôt disponible"
      >
        Relances à faire
      </button>
      <button type="button" id="reset-session-btn" class="btn-reset">
        Nouvelle session
      </button>
    </nav>
  </header>

  <main class="home-grid">
    <!-- Colonne gauche : recherche, liste des contacts et résumés -->
    <section class="contacts-column" aria-label="Contacts et résumés">
      <div class="contacts-panel">
        <input
          id="contact-search"
          type="search"
          placeholder="Rechercher un contact (nom, email, insta...)"
          autocomplete="off"
        />
        <ul id="contacts-list"></ul>
      </div>

      <div class="contact-detail">
        <div id="empty-state" class="empty-state">
          Sélectionne un contact pour consulter sa fiche et ses résumés de threads.
        </div>

        <div id="selected-contact" hidden>
          <div class="contact-header">
            <div>
              <h2 id="contact-name"></h2>
              <p id="contact-email"></p>
              <p id="contact-instagram"></p>
            </div>
            <button id="toggle-summaries-btn" type="button" class="btn btn-primary">
              Afficher les résumés
            </button>
          </div>
          <div id="summaries-container"></div>
        </div>
      </div>
    </section>

    <!-- Colonne droite : chatbox -->
    <section class="chat-panel" aria-label="Assistant CRM">
      <div class="chat-panel-header">
        <h2>Assistant</h2>
      </div>

      <div id="messages"></div>

      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Pose une question sur tes contacts, échanges ou relances..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn" class="btn btn-primary">Envoyer</button>
      </form>
    </section>
  </main>

  <script type="module" src="/static/js/contacts.js"></script>
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
