<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Plumes CRM — Regroupement des contacts</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #1e293b; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .flash { background: #dcfce7; border: 1px solid #86efac; color: #166534; padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .manual-box, .pair-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: .75rem 0; }
    .contact-col { background: #f1f5f9; padding: .9rem; border-radius: 6px; }
    .badge { display: inline-block; background: #e0e7ff; color: #3730a3; font-size: .8rem; padding: .2rem .55rem; border-radius: 999px; margin-right: .35rem; }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .75rem; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: .5rem .9rem; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-ghost { background: #e2e8f0; color: #334155; }
    input[type="number"] { padding: .45rem; border: 1px solid #cbd5e1; border-radius: 6px; width: 110px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Regroupement des contacts &amp; canaux</h1>
    <a href="/">← Retour à l'assistant</a>
  </div>

  <div id="flash-container"></div>

  <div class="manual-box">
    <h3>Fusion manuelle (ex. compte Instagram + fiche Gmail)</h3>
    <form method="post" action="/duplicates/merge" style="display:flex; gap:.75rem; align-items:center; flex-wrap:wrap;">
      <label>Garder ID maître : <input type="number" name="master_id" required /></label>
      <label>Absorber ID doublon : <input type="number" name="duplicate_id" required /></label>
      <button type="submit" class="btn-primary">Fusionner</button>
    </form>
  </div>

  <h2 id="candidates-title">Doublons suggérés</h2>
  <div id="candidates-container"></div>

  <script>
    const FLASH_MSG = "__FLASH_MSG__";
    const CANDIDATES = __CANDIDATES_JSON__;

    const flashContainer = document.getElementById("flash-container");
    if (FLASH_MSG) {
      const div = document.createElement("div");
      div.className = "flash";
      div.textContent = FLASH_MSG;
      flashContainer.appendChild(div);
    }

    const titleEl = document.getElementById("candidates-title");
    const containerEl = document.getElementById("candidates-container");
    titleEl.textContent = `Doublons suggérés (${CANDIDATES.length})`;

    function makeHiddenForm(action, fields) {
      const form = document.createElement("form");
      form.method = "post";
      form.action = action;
      for (const [name, value] of Object.entries(fields)) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        form.appendChild(input);
      }
      return form;
    }

    function makeContactCol(labelPrefix, contact) {
      const col = document.createElement("div");
      col.className = "contact-col";

      const title = document.createElement("strong");
      const displayName = contact.name || "Sans nom";
      title.textContent = `${labelPrefix} : #${contact.id} — ${displayName}`;
      col.appendChild(title);

      const countP = document.createElement("p");
      countP.textContent = `${contact.message_count} message(s)`;
      col.appendChild(countP);

      const ul = document.createElement("ul");
      for (const ch of (contact.channels || [])) {
        const li = document.createElement("li");
        const code = document.createElement("code");
        code.textContent = ch.channel;
        li.appendChild(code);
        li.appendChild(document.createTextNode(` : ${ch.identifier}`));
        ul.appendChild(li);
      }
      col.appendChild(ul);

      return col;
    }

    if (!CANDIDATES.length) {
      const p = document.createElement("p");
      p.textContent = "Aucun doublon détecté automatiquement pour le moment.";
      containerEl.appendChild(p);
    } else {
      for (const item of CANDIDATES) {
        const card = document.createElement("div");
        card.className = "pair-card";

        const badgesDiv = document.createElement("div");
        for (const reason of (item.reasons || [])) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = reason;
          badgesDiv.appendChild(badge);
        }
        card.appendChild(badgesDiv);

        const grid = document.createElement("div");
        grid.className = "grid";
        grid.appendChild(makeContactCol("Fiche A (Maître)", item.master));
        grid.appendChild(makeContactCol("Fiche B (Doublon)", item.duplicate));
        card.appendChild(grid);

        const actions = document.createElement("div");
        actions.className = "actions";

        const nameA = item.master.name || "Sans nom";
        const nameB = item.duplicate.name || "Sans nom";


function contactLabel(contact) {
          const ids = (contact.channels || [])
            .map((ch) => ch.identifier)
            .filter(Boolean);
          if (ids.length > 0) {
            return ids.join(", ");
          }
          return contact.name || `#${contact.id}`;
        }

        const labelA = contactLabel(item.master);
        const labelB = contactLabel(item.duplicate);

        const formMergeBA = makeHiddenForm("/duplicates/merge", {
          master_id: item.master.id,
          duplicate_id: item.duplicate.id,
        });
        const btnBA = document.createElement("button");
        btnBA.type = "submit";
        btnBA.className = "btn-primary";
        btnBA.textContent = `Fusionner ${labelB} dans ${labelA}`;
        formMergeBA.appendChild(btnBA);
        actions.appendChild(formMergeBA);

        const formMergeAB = makeHiddenForm("/duplicates/merge", {
          master_id: item.duplicate.id,
          duplicate_id: item.master.id,
        });
        const btnAB = document.createElement("button");
        btnAB.type = "submit";
        btnAB.className = "btn-secondary";
        btnAB.textContent = `Inverser : Fusionner ${labelA} dans ${labelB}`;
        formMergeAB.appendChild(btnAB);
        actions.appendChild(formMergeAB);

        const formIgnore = makeHiddenForm("/duplicates/ignore", {
          id_a: item.master.id,
          id_b: item.duplicate.id,
        });
        const btnIgnore = document.createElement("button");
        btnIgnore.type = "submit";
        btnIgnore.className = "btn-ghost";
        btnIgnore.textContent = "Ignorer (personnes différentes)";
        formIgnore.appendChild(btnIgnore);
        actions.appendChild(formIgnore);

        card.appendChild(actions);
        containerEl.appendChild(card);
      }
    }
  </script>
</body>
</html>
