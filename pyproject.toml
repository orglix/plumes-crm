[project]
name = "plumes-crm"
version = "0.1.0"
description = "CMR AI for Plumes-creatives"
readme = "README.md"
requires-python = ">=3.15.2"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "psycopg[binary]>=3.2.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
]

[project.scripts]
plumes-crm = "plumes_crm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
indent-width = 2
line-length = 100